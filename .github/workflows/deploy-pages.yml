name: Manual legacy Pages publisher (disabled on push)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "elite-camp-pages-manual"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages match latest version
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://rayan2099.github.io/elite-camp-selection-lab"
          for file in index.html calendar.html elite-planner-2026-11.html; do
            echo "Checking $file (not GitHub source, actual published URL)"
            match=0
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/$file?verify=${GITHUB_SHA}-$attempt" | grep -F 'Elite Planner · 2026.11.04.2' >/dev/null; then
                echo "Published $file contains latest version marker"
                match=1
                break
              fi
              echo "Published content not updated yet for $file, attempt $attempt"
              sleep 10
            done
            if [ "$match" -ne 1 ]; then
              echo "::error::Live GitHub Pages $file does not contain the expected version. Investigate GitHub Pages source or CDN."
              exit 1
            fi
          done
