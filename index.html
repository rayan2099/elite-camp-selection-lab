<script>
/* Remove automatically appended ChatGPT referral parameters from the displayed URL.
   Preserve the selected section (#builder, #finance, etc.) and unrelated query options. */
(function(){
  try{
    var url=new URL(window.location.href);
    var changed=false;
    for(var key of Array.from(url.searchParams.keys())){
      if(/^utm_/i.test(key)&&url.searchParams.getAll(key).some(function(value){return /chatgpt(?:\.com|\.site)?/i.test(value)})){
        url.searchParams.delete(key);changed=true;
      }
    }
    if(changed){
      window.history.replaceState(window.history.state,'',url.pathname+url.search+url.hash);
    }
  }catch(error){console.warn('Referral URL cleanup skipped',error)}
})();
</script>

.row.start{justify-content:flex-start}
.wrap{flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.orange{background:var(--accentsoft);color:#a8501c}
html[data-theme=dark] .pill.orange{color:#ffb98a}
.pill.good{background:#16866014;color:var(--good)}
.pill.bad{background:#b4231814;color:var(--bad)}
.pill.navy{background:var(--navy);color:#fff}
html[data-theme=dark] .pill.navy{background:var(--accent);color:#22140d}
.pill.line{background:transparent;border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s}
.bar.good>i{background:var(--good)}
.bar.bad>i{background:var(--bad)}
.kv{display:flex;align-items:baseline;gap:8px}
.big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.metric .label{font-size:12px;color:var(--muted);font-weight:600}
.metric .value{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.metric .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.note{background:var(--soft);border-radius:11px;padding:13px;font-size:13px}
.note.orange{background:var(--accentsoft)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ---------- forms ---------- */
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
label.fld input,label.fld select,label.fld textarea{min-width:0;font-weight:400;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;width:100%}
label.fld input:focus,label.fld select:focus,label.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.fld textarea{resize:vertical;min-height:70px;line-height:1.6}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .wide{grid-column:1/-1}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.filters input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:13px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:none;border-radius:0;padding:7px 12px;font-size:12.5px;background:transparent}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
html[data-theme=dark] .seg button.on{background:var(--accent);color:#22140d}

/* ---------- library ---------- */
.custom-add-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
.custom-add-row input{flex:1;min-width:170px;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface);color:var(--fg);font:inherit;font-weight:400}
.custom-add-row input:focus{outline:2px solid var(--accent)}
.custom-add-row button{border-color:var(--accent);color:var(--fg);font-weight:750;min-height:40px;background:var(--accentsoft)}
.custom-add-row button:hover{background:var(--accent);color:#22140d}
/* Accessible, responsive selection tiles for program skills and requirements */
.custom-option-section{display:flex;flex-direction:column;gap:8px;min-width:0}
.custom-option-title{font-size:13px;font-weight:800;color:var(--fg)}
.custom-option-section>.help{font-weight:400}
.custom-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);width:100%;max-height:none;overflow:visible;min-width:0}
.custom-checks label{display:flex;align-items:center;justify-content:flex-start;gap:11px;min-width:0;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;font-weight:600;color:var(--fg);cursor:pointer;line-height:1.55;white-space:normal;overflow-wrap:anywhere;transition:background .15s,border-color .15s,box-shadow .15s}
.custom-checks label:hover{border-color:var(--accent);background:var(--accentsoft)}
.custom-checks label:has(input:checked){border-color:var(--accent);background:var(--accentsoft);box-shadow:inset 0 0 0 1px var(--accent)}
.custom-checks label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.custom-checks input[type="checkbox"]{width:19px;height:19px;min-width:19px;margin:0;accent-color:var(--accent);flex:none;cursor:pointer}
.custom-checks .option-text{display:block;min-width:0;flex:1;line-height:1.5}
@media(max-width:800px){.custom-checks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.custom-checks{grid-template-columns:1fr;padding:9px}.custom-checks label{min-height:46px}}

.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.libcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;flex-direction:column;gap:10px;position:relative;transition:.15s;border-inline-start:3px solid var(--tc,var(--line))}
.libcard:hover{box-shadow:0 10px 26px #12223a10;transform:translateY(-1px)}
.libcard.on{background:color-mix(in srgb,var(--accentsoft) 55%,var(--surface));border-color:var(--accent)}
.libcard .ttl{font-size:15px;font-weight:800;line-height:1.45}
.libcard .goal{font-size:12.5px;color:var(--muted);line-height:1.65;flex:1}
.libcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trackchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.trackchip i{width:7px;height:7px;border-radius:50%;background:var(--tc);display:inline-block}
.libcard .foot{display:flex;gap:7px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px}

/* ---------- table ---------- */
.tablewrap{overflow:auto;border-radius:11px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.wide{min-width:1040px}
th,td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--soft);font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
td select,td input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;max-width:100%}

/* ---------- day board ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(322px,1fr));gap:14px}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.daycol.over{border-color:var(--warn);box-shadow:0 0 0 3px #c2410c14}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px}
.dayhead b{font-size:13.5px}
.dayhead small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.chip{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:9px;padding:7px 9px;font-size:12px;line-height:1.45}
.chip .x{border:none;background:transparent;color:var(--muted);padding:0 2px;font-size:14px;line-height:1}
.chip .x:hover{color:var(--bad)}
.chip i.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--tc)}
.chip.core{background:var(--accentsoft)}

/* ---------- readiness ---------- */
.checks{display:flex;flex-direction:column;gap:0}
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;margin-top:2px}
.check .ic.ok{background:#16866018;color:var(--good)}
.check .ic.no{background:#c2410c18;color:var(--warn)}
.check b{font-size:13.5px;display:block}
.check p{font-size:12px;color:var(--muted);line-height:1.6}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}


/* ---------- lego builder ---------- */
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.st{flex:1 1 148px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px 12px;font-size:12.5px;text-align:center;min-width:0}
.st b{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:15px;flex:none;font-weight:800}
.st span{font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.st.on{border-color:var(--accent);background:color-mix(in srgb,var(--accentsoft) 55%,var(--surface));box-shadow:0 0 0 3px #f07b3a14}
.st.on b{background:var(--accent);color:#22140d}
.st.done b{background:var(--good);color:#fff}


.plate{position:relative;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:10px;
  background-image:radial-gradient(circle at 5px 5px,var(--soft2) 2.6px,transparent 3px);background-size:18px 18px;transition:.15s}
.plate.drop{border-color:var(--accent);box-shadow:0 0 0 3px #f07b3a22;background-color:var(--accentsoft)}
.plate .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-bottom:8px}
.plate .phead b{font-size:12.5px;display:block;line-height:1.4}
.plate .phead small{color:var(--muted);font-size:10.5px}
.plate .pbody{min-height:96px;display:flex;flex-direction:column;gap:2px}
.plate.armed{border-color:var(--accent);border-style:dashed}
.plate.armed .pbody:after{content:attr(data-hint);display:block;text-align:center;color:var(--muted);font-size:11px;padding:16px 0}

.brick{position:relative;color:#fff;border-radius:8px;padding:8px 11px 7px;font-size:12px;line-height:1.45;cursor:grab;background:var(--bc);
  box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 -2px 0 rgba(0,0,0,.12);margin-top:11px;user-select:none;transition:transform .12s}
.brick{border:1px solid rgba(255,255,255,.28)}
.brick .brick-symbol{color:#fff}
.brick:has(.elite-tray-remove){padding-inline-end:45px}
.elite-tray-remove{position:absolute;inset-inline-end:9px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:31px;height:34px;padding:6px;border-radius:8px;border:1px solid #ffffff88;background:#ffffff23;color:#fff;cursor:pointer;z-index:2;transition:background .15s,transform .15s}
.elite-tray-remove svg{width:18px;height:18px;pointer-events:none}
.elite-tray-remove:hover{background:#fff;color:#b42318;transform:translateY(-50%) scale(1.07)}
.elite-tray-remove:focus-visible{outline:3px solid #fff;outline-offset:2px}
.brick:hover{transform:translateY(-1px)}
.brick:active{cursor:grabbing}
.brick .studs{position:absolute;top:-5px;inset-inline-start:9px;display:flex;gap:4px;pointer-events:none}
.brick .studs i{width:9px;height:9px;border-radius:50%;background:var(--bc);filter:brightness(1.16);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.brick b{font-weight:700}
.brick .meta{font-size:10px;opacity:.9;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.brick .meta span{white-space:nowrap}
.brick.held{outline:3px solid #fff;outline-offset:-3px;transform:translateY(-3px) rotate(-1.5deg);box-shadow:0 8px 18px rgba(0,0,0,.28)}
.brick.mini{padding:4px 8px 3px;font-size:10px;margin-top:8px;border-radius:6px}
.brick.mini .studs i{width:6px;height:6px}
.brick.ghost{opacity:.45;filter:grayscale(.25)}

.tray{border:1px dashed var(--line);background:var(--soft);border-radius:14px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-content:flex-start;min-height:86px}
.tray .brick{margin-top:10px;flex:0 0 auto;max-width:200px}
.tray .empty{width:100%;text-align:center;color:var(--muted);font-size:12px;padding:18px 0}

.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.bins .bin[hidden]{display:none!important}
.bin{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bin .ttl{font-size:12px;font-weight:700;line-height:1.45;padding-top:6px}
.bin .sub{font-size:10.5px;color:var(--muted)}
.bin .row{margin-top:auto}
.bin .studs{position:absolute;top:-1px;inset-inline-start:10px;display:flex;gap:4px}
.bin .studs i{width:8px;height:8px;border-radius:50%;background:var(--bc)}

.struct{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;min-height:170px}
.struct .col{display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.struct .col .brick{margin-top:6px}
.struct .lbl{text-align:center;font-size:10px;color:var(--muted);margin-top:6px}

.checklg{display:flex;flex-direction:column;gap:8px}
.cg{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:10px 12px;border:1px solid transparent}
.cg.ok{background:#16866010;border-color:#16866030}
.cg.no{background:#c2410c0d;border-color:#c2410c30}
.cg .led{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex:none;background:var(--surface)}
.cg.ok .led{color:var(--good)}
.cg.no .led{color:var(--warn)}
.cg b{font-size:12.5px}
.cg p{margin:0;font-size:11px;color:var(--muted)}

.plan-day{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.plan-day:last-child{border-bottom:none}
.plan-day .dn{background:var(--navy);color:#fff;border-radius:10px;display:grid;place-items:center;height:44px;font-weight:800;font-size:12px}
html[data-theme=dark] .plan-day .dn{background:var(--accent);color:#22140d}
.plan-brick{display:grid;grid-template-columns:4px 1fr;gap:10px;background:var(--soft);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.plan-brick i{background:var(--bc);border-radius:3px}
.plan-brick .why{font-size:11px;color:var(--muted);line-height:1.6;margin-top:2px}
.sharebox{display:flex;gap:8px;align-items:center;margin-top:10px}
.sharebox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:11.5px;direction:ltr}

.build2{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.build3{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.bar-strip{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:11.5px;color:var(--muted);margin-bottom:16px}
.bar-strip b{color:var(--fg);font-size:14px;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.buildbar{height:7px;border-radius:99px;background:var(--soft2);flex:1;min-width:80px;overflow:hidden}
.buildbar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
@media(max-width:1080px){.build2,.build3{grid-template-columns:1fr}}

/* ---------- camps ---------- */
.campgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.campcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.campcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px #12223a18;border-color:var(--accent)}
.campcard.active{border-color:var(--accent);box-shadow:0 0 0 2px #f07b3a33}
.campcover{height:74px;background:linear-gradient(130deg,var(--c1),var(--c2));padding:9px 11px;display:flex;align-items:flex-start;justify-content:space-between;position:relative;overflow:hidden}
.campcover:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 5px 5px,#ffffff2b 2.6px,transparent 3px);background-size:17px 17px}
.campcover .pill{position:relative;z-index:1;background:#fff;color:#12223a}
.campcover svg{width:36px;height:19px;color:#fff;opacity:.9;position:relative;z-index:1}
.campbody{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}
.campbody h3{font-size:15px;line-height:1.4}
.cc-metrics{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.cc-metrics b{color:var(--fg);font-size:12px}
.cc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);flex-wrap:wrap}
.wizdots{display:flex;gap:6px;margin:12px 0 18px}
.wizdots i{height:5px;flex:1;border-radius:99px;background:var(--soft2)}
.wizdots i.on{background:var(--accent)}

/* ---------- daily timeline ---------- */
.tl{--tl-time:92px;position:relative;margin-top:6px}
.tl:before{content:"";position:absolute;top:8px;bottom:8px;inset-inline-start:calc(var(--tl-time) + 17px);width:2px;background:var(--soft2)}
.tlrow{display:grid;grid-template-columns:var(--tl-time) 34px 1fr;gap:10px;align-items:flex-start;position:relative;padding:4px 0}
.tltime{font-size:10.5px;color:var(--muted);text-align:end;padding-top:9px;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.tldot{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.tldot svg{width:15px;height:15px}
.tlrow.prog .tldot{background:var(--accent);color:#22140d}
.tlbody{padding-top:5px;min-width:0}
.tlbody>b{font-size:12.5px;display:block}
.tlprog{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:fit-content;max-width:100%;background:color-mix(in srgb,var(--bc) 13%,var(--surface));border-inline-start:3px solid var(--bc);border-radius:8px;padding:6px 9px;margin:5px 0}
.tlname{font-size:12px;font-weight:700}
.tlmeta{font-size:10px;color:var(--muted)}
.tlwhy{flex-basis:100%;font-size:10.5px;color:var(--muted);line-height:1.6}
.tlhint{font-size:10.5px;color:var(--muted)}
.tlrow.tl-empty .tldot{opacity:.5}
.daybar{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}
.daynum{background:var(--navy);color:#fff;border-radius:10px;padding:6px 12px;text-align:center;line-height:1.15;min-width:56px}
.daynum small{font-size:8.5px;letter-spacing:.08em;opacity:.75;display:block}
.daynum b{font-size:18px}
html[data-theme=dark] .daynum{background:var(--accent);color:#22140d}
@media(max-width:600px){.tl{--tl-time:68px}.tltime{font-size:9.5px}.tlbody>b{font-size:11.5px}}
/* ---------- misc ---------- */
#modal{border:none;padding:0;border-radius:16px;max-width:min(760px,94vw);width:100%;background:var(--surface);color:var(--fg);box-shadow:0 30px 90px #07101f55}
#modal::backdrop{background:#07101f66;backdrop-filter:blur(3px)}
#modal .inner{padding:22px;max-height:88vh;overflow:auto}
#modal .x{position:absolute;inset-inline-end:14px;top:12px;width:32px;height:32px;display:grid;place-items:center;border:none;border-radius:50%;background:var(--soft);font-size:14px;color:var(--muted);padding:0;line-height:1}
#toasts{position:fixed;inset-inline-end:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:10px 15px;border-radius:10px;font-size:12.5px;box-shadow:0 12px 30px #07101f55;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.phase{display:grid;gap:8px}
.phase .p{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:12.5px;line-height:1.75}
.phase .p>b:first-child{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--soft);font-size:11px;flex:none}
.phase .p span{color:var(--muted)}
.pv{display:flex;gap:10px;align-items:center;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pv:last-child{border:none}
.tagcloud{display:flex;gap:6px;flex-wrap:wrap}
.ladder{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:8px 10px;background:var(--soft);border-radius:9px}
.step>b:first-child{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--surface);font-size:10.5px;flex:none;flex:none}
.locked{display:grid;place-items:center;gap:10px;padding:44px 20px;text-align:center}
.statline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.statline b{color:var(--fg);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:5px}

/* matrix */
.matrix td,.matrix th{text-align:center;font-size:12px}
.matrix td:first-child,.matrix th:first-child{text-align:start}
.matrix .cell{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:6px;background:var(--soft);font-size:11.5px;font-weight:700}
.matrix .cell.z{background:transparent;color:#cfd8e3}
.matrix .cell.l1{background:#f07b3a22;color:#a8501c}
.matrix .cell.l2{background:#f07b3a55;color:#7a3711}
.matrix .cell.l3{background:var(--accent);color:#22140d}


/* Clean professional program cards and compact responsive builder stats */
.ui-line-icon{display:block;width:19px;height:19px;flex:none}
.bar-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;align-items:center;padding:13px 15px;overflow:visible}
.build-stat{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap;line-height:1.4}
.build-stat-label{font-size:11.5px;line-height:1.5;min-width:0;color:var(--muted)}
.build-stat b{font-size:19px;margin-inline-start:auto;color:var(--fg);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.build-stat-icon{color:var(--accent);background:var(--accentsoft);border-radius:9px;width:31px;height:31px;display:grid;place-items:center;flex:none}
.build-stat-icon .ui-line-icon{width:17px;height:17px}
.bar-strip .buildbar{grid-column:1/-1;width:100%;height:7px;margin:0;min-width:0}
.bin{padding:14px;gap:9px;overflow:hidden;border-radius:13px;background:var(--surface);border-inline-start:3px solid var(--bc);min-height:173px}
.bin .ttl{font-size:13px;line-height:1.5;font-weight:800;padding:0;overflow-wrap:anywhere}
.bin .program-icon{display:grid;place-items:center;align-self:flex-start;flex:none;width:37px;height:37px;border-radius:10px;background:color-mix(in srgb,var(--bc) 12%,var(--surface));color:var(--bc)}
.bin .program-icon svg{width:20px;height:20px}
.bin .row{gap:6px;flex-wrap:wrap;align-items:center}
.bin .studs,.brick .studs{display:none!important}
.brick{margin-top:0;box-shadow:none;border:1px solid color-mix(in srgb,var(--bc) 75%,#fff);display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;min-height:43px;cursor:grab}
.brick .brick-symbol{display:inline-grid;place-items:center;flex:none;background:#ffffff26;border-radius:6px;width:26px;height:26px}
.brick .brick-symbol svg{width:16px;height:16px}
.brick b{flex:1;min-width:100px;overflow-wrap:anywhere}
.brick .meta{flex-basis:100%;margin-top:0}
.brick.mini{margin-top:4px;min-height:31px;padding:4px 6px}
.brick.mini .brick-symbol{width:19px;height:19px}
.brick.mini .brick-symbol svg{width:13px;height:13px}
.tray .brick{margin-top:0}
@media(max-width:1150px){.bar-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.bar-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px}.build-stat{align-items:flex-start}.build-stat b{width:100%;margin-inline-start:37px}.build-stat-label{font-size:10.5px}.bin{min-height:150px}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  #sidebar,#topbar,.noprint,#toasts,.pagehead,.stepper,.bar-strip{display:none!important}
  #shell{grid-template-columns:1fr}
  #app{padding:0;max-width:none}

  .daybar{border-bottom:2px solid #0d1f3a}

@media(max-width:1080px){
  .cols4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  #shell{grid-template-columns:1fr}
  #sidebar{position:fixed;inset-inline-start:0;top:0;z-index:60;width:270px;transform:translateX(110%);transition:.2s;box-shadow:0 0 60px #0003}
  html[dir=rtl] #sidebar{inset-inline-start:auto;inset-inline-end:0;transform:translateX(-110%)}
  #sidebar.open{transform:none}
  #hamb{display:inline-block}
  #app{padding:16px 14px 50px}
  .cols2,.cols3,.cols4{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  h1{font-size:21px}
  #topbar{padding:9px 14px}
  .crumb{display:none}
}

  .dayblock .daynum{min-width:16mm;height:16mm;display:grid;align-content:center;background:#f5823c!important;color:#192536!important;padding:1.2mm 2mm!important;border-radius:2mm}

  .print-day-context>div{border:1px solid #dbe4ed;background:#f4f7fa;border-radius:2mm;padding:2mm 3mm;min-width:0}
  .print-day-context span{display:block;font-size:6.5pt;color:#60758c;margin-bottom:1mm}
  .print-day-context b{display:block;color:#17324e;font-size:8.5pt;line-height:1.4;overflow-wrap:anywhere}
  .dayblock .print-section-label{display:flex!important;align-items:center;justify-content:space-between;border-bottom:1.4px solid #dfebf5;padding-bottom:2mm;margin:1mm 0 2mm}
  .print-section-label b{font-size:9pt;color:#142b47}
  .print-section-label span{font-size:7pt;color:#697d91}
  .dayblock .tl{--tl-time:30mm!important;margin:0!important;display:flex!important;flex-direction:column;gap:0!important}

/* Dedicated schedule print rules: exactly one print sheet per camp day,
   without compounded before/after page breaks and without surrounding UI. */
@media print{
  @page{size:A4 portrait;margin:9mm 11mm 10mm}
  body:has(.schedule-print-pages) #app > :not(.schedule-print-pages){display:none!important}
  body:has(.schedule-print-pages) #app > .schedule-print-pages{
    display:block!important;margin:0!important;padding:0!important;
    width:100%!important;max-width:none!important;
    break-before:auto!important;break-after:auto!important;
  }
  body:has(.schedule-print-pages) .schedule-print-pages > .dayblock,
  body:has(.schedule-print-pages) .schedule-print-pages > .dayblock.pbreak{
    display:block!important;
    margin:0!important;padding:0!important;
    height:auto!important;min-height:0!important;
    break-before:auto!important;page-break-before:auto!important;
    break-after:page!important;page-break-after:always!important;
    break-inside:auto!important;page-break-inside:auto!important;
  }
  body:has(.schedule-print-pages) .schedule-print-pages > .dayblock:last-child{
    break-after:auto!important;page-break-after:auto!important;
  }
  body:has(.schedule-print-pages) .schedule-print-pages .daybar,
  body:has(.schedule-print-pages) .schedule-print-pages .tlrow,
  body:has(.schedule-print-pages) .schedule-print-pages .print-day-masthead,
  body:has(.schedule-print-pages) .schedule-print-pages .print-day-context,
  body:has(.schedule-print-pages) .schedule-print-pages .print-section-label,
  body:has(.schedule-print-pages) .schedule-print-pages .print-day-foot{
    break-inside:avoid!important;page-break-inside:avoid!important;
  }
  body:has(.schedule-print-pages) .schedule-print-pages .tlrow{
    min-height:7.2mm!important;padding:1mm 1.5mm!important;
  }
  body:has(.schedule-print-pages) .schedule-print-pages .tlbody{gap:.6mm 1.5mm!important}
  body:has(.schedule-print-pages) .schedule-print-pages .tlwhy{font-size:6.6pt!important;line-height:1.25!important}
  body:has(.schedule-print-pages) .schedule-print-pages .print-day-foot{margin-top:2mm!important}
}

/* Opportunity calendar — camp planning prototype */
.oc-page{--oc-orange:#f47b3b;--oc-green:#168768}
.oc-hero{border-radius:17px;background:linear-gradient(120deg,#112b49,#1b4166);padding:22px 25px;color:white;display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:16px;overflow:hidden}
.oc-hero h1{font-size:clamp(23px,3vw,31px);line-height:1.5;color:white;margin:3px 0}
.oc-hero p{color:#cbd8e7;font-size:12px;max-width:620px}
.oc-hero .oc-kicker{color:#ffae77;font-weight:800;font-size:11px}
.oc-hero button{background:#f47b3b;border:0;color:white;white-space:nowrap;font-weight:800}
.oc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:16px}
.oc-stat,.oc-panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.oc-stat{padding:15px;min-width:0}
.oc-stat span{font-size:11px;color:var(--muted);display:block}
.oc-stat strong{display:block;font-size:24px;line-height:1.5;color:var(--fg)}
.oc-stat small{font-size:10.5px;color:var(--oc-green)}
.oc-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.9fr);gap:14px;align-items:start}
.oc-stack{display:grid;gap:14px}
.oc-panel{padding:17px;min-width:0}
.oc-panel h2{font-size:17px;margin:0}
.oc-panel h3{font-size:13px;margin:0}
.oc-head{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:13px}
.oc-muted{font-size:11.5px;color:var(--muted)}
.oc-arrows{display:flex;gap:7px;align-items:center}
.oc-arrows button{padding:3px 10px;font-size:18px;min-width:32px}
.oc-arrows b{min-width:112px;text-align:center;font-size:13px}
.oc-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.oc-filters button{font-size:11px;padding:5px 9px}
.oc-filters button.active{background:var(--accentsoft);border-color:var(--accent);color:var(--warn)}
.oc-week,.oc-cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.oc-week{margin-bottom:5px}
.oc-week span{text-align:center;color:var(--muted);font-size:10px;padding:5px 0}
.oc-cell{border:1px solid var(--line);border-radius:9px;background:var(--soft);min-height:65px;padding:7px;text-align:start;position:relative;min-width:0}
.oc-cell b{font-size:11px}
.oc-cell small{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.oc-cell.break{background:#e8f6f0;border-color:#d2ebde;color:#1a6d55}
.oc-cell.national,.oc-cell.season{background:#fff0e5;border-color:#f5ddc9;color:#ad5d28}
.oc-cell.current{outline:2px solid var(--accent);outline-offset:-2px}
.oc-cell.selected{box-shadow:inset 0 0 0 2px var(--accent)}
.oc-cell.off{border:0;background:transparent;cursor:default}
.oc-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}
.oc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:5px}
.oc-hint{padding:11px 12px;border-radius:9px;background:var(--soft);color:var(--muted);font-size:11px;margin-top:14px}
.oc-op{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;text-align:start;margin-top:8px;background:var(--surface)}
.oc-op-select{display:block;width:100%;padding:0;border:0;background:transparent;text-align:start;cursor:pointer;color:inherit;font:inherit}
.oc-op:focus-within{border-color:var(--accent)}
.oc-op:hover{border-color:var(--accent)}
.oc-op.active{background:var(--accentsoft);border-color:var(--accent)}
.oc-op strong{display:block;font-size:13px}
.oc-op small{font-size:11px;color:var(--muted)}
.oc-op .oc-score{font-size:21px;font-weight:850;color:var(--oc-green);direction:ltr}
.oc-score small{font-size:10px}
.oc-meter{height:5px;background:var(--soft2);border-radius:8px;overflow:hidden;margin-top:9px}
.oc-meter i{height:100%;display:block;border-radius:8px;background:#1a9b76}
.oc-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oc-reason{display:flex;gap:9px;align-items:start;margin:9px 0;font-size:11.5px;color:var(--muted)}
.oc-reason i{font-style:normal;color:var(--oc-green);font-weight:800}
.oc-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
.oc-form label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.oc-form input,.oc-form select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:9px}
.oc-result{padding:13px;border:1px solid #b8e0cf;background:#eaf7f1;color:#145e49;border-radius:10px;margin-top:12px;font-size:12px}
.oc-result p{margin-top:5px}
.oc-page .oc-create-compact{display:inline-flex!important;align-items:center;justify-content:center;width:auto!important;max-width:100%;min-height:36px;padding:8px 14px!important;margin:10px 0 8px!important;border-radius:9px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.5;cursor:pointer}
.oc-compare-panel{direction:rtl;text-align:right}
.oc-compare-panel[dir="ltr"]{direction:ltr;text-align:left}
.oc-compare-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.oc-compare-heading>div{min-width:0;flex:1}
.oc-compare-heading h2,.oc-compare-heading p{text-align:start;margin-bottom:6px}
.oc-compare-heading button{flex-shrink:0}
.oc-compare-preview{font-size:12px;color:var(--muted);line-height:1.8;margin-top:10px;text-align:start}
.oc-decision-summary{margin-top:16px;padding:17px;border-radius:13px;border:1px solid #bcdccf;background:#edf8f3;color:#134c3c;text-align:start}
.oc-decision-summary h3{font-size:16px;line-height:1.5;margin:8px 0}
.oc-decision-summary p{font-size:12px;line-height:1.9;margin:0 0 14px}
.oc-decision-tag{display:inline-block;font-size:11px;padding:4px 9px;border-radius:18px;background:#d9f0e5;font-weight:700}
.oc-compare-scroll{width:100%;overflow-x:auto;margin-top:15px;border:1px solid var(--line);border-radius:12px}
.oc-compare{width:100%;min-width:840px;border-collapse:collapse;direction:inherit;text-align:start}
.oc-compare th,.oc-compare td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:start;font-size:11px;line-height:1.75;vertical-align:top}
.oc-compare thead th{background:#edf2f7;color:#243952;white-space:nowrap;font-weight:800}
.oc-compare tbody tr:last-child td,.oc-compare tbody tr:last-child th{border-bottom:0}
.oc-compare tbody th{min-width:130px}
.oc-compare tbody th small{display:block;font-weight:400;color:var(--muted);white-space:nowrap}
.oc-compare tbody td{min-width:110px}

function programBalance(){
 const types={sport:0,skills:0,culture:0,trips:0},modes={theoretical:0,practical:0,recreational:0};
 const days=S.meta.days.map((_,j)=>({day:j+1,activities:0,types:{sport:0,skills:0,culture:0,trips:0},modes:{theoretical:0,practical:0},notes:[]}));
 S.selected.forEach(x=>{const i=ITEM(x.id);if(!i)return;
  const type=i.t==='sport'?'sport':i.t==='trips'?'trips':i.t==='values'?'culture':'skills';
  const mode=x.activityType||activityType(i);types[type]++;modes[mode]++;
  const d=days[x.day-1];if(d){d.activities++;d.types[type]++;d.modes[mode]++;}
 });
 const recommendations=[];
 if(S.selected.length){
  for(const [key,count] of Object.entries(types)){if(!count)recommendations.push(T({sport:'لا توجد أنشطة رياضية ضمن الاختيار.',skills:'لا توجد أنشطة مهارية ضمن الاختيار.',culture:'لا توجد أنشطة ثقافية أو قيمية ضمن الاختيار.',trips:'لا توجد رحلات ضمن الاختيار.'}[key],{sport:'No sport activities selected.',skills:'No skills activities selected.',culture:'No cultural or values activities selected.',trips:'No trips selected.'}[key]));}
  if(!modes.practical)recommendations.push(T('البرامج المختارة مصنفة نظرياً؛ راجع فرص التطبيق العملي.','Selected programs are theoretical; consider hands-on practice.'));
  if(!modes.theoretical)recommendations.push(T('البرامج المختارة عملية؛ راجع فرص التهيئة والمعرفة.','Selected programs are practical; consider preparation and learning.'));
  days.forEach(d=>{
   if(!d.activities)d.notes.push(T('لا توجد برامج موزعة لهذا اليوم.','No programs scheduled on this day.'));
   if(d.activities>3)d.notes.push(T('يضم اليوم '+d.activities+' برامج؛ راجع سعة الجدول والتداخلات.','This day has '+d.activities+' programs; check capacity and overlaps.'));
   for(const [key,count] of Object.entries(d.types))if(count>=3)d.notes.push(T('تكرار ملحوظ في أنشطة '+({sport:'الرياضة',skills:'المهارات',culture:'الثقافة والقيم',trips:'الرحلات'}[key])+' ('+count+').','Repeated '+key+' activities ('+count+').'));
  });
 }
 return {types,modes,days,recommendations};
}

function fitStats(){
  const total=S.students.length;

  S.students.forEach(st=>{
    const matches=S.selected.filter(x=>{const i=ITEM(x.id);return i&&i.tags.some(t=>st.tags.includes(t))});
    if(matches.length)covered++;
    per.push({st,matches});
  });
  return {pct:total?Math.round(covered/total*100):0,total,covered,per};
}

function tagCoverage(){
  const all={};
  S.students.forEach(s=>s.tags.forEach(t=>{all[t]=all[t]||{tag:t,students:[],items:[]}}));
  S.students.forEach(s=>s.tags.forEach(t=>all[t].students.push(s)));
  S.selected.forEach(x=>{const i=ITEM(x.id);if(!i)return;i.tags.forEach(t=>{if(all[t])all[t].items.push(i)})});
  return Object.values(all).sort((a,b)=>b.students.length-a.students.length);
}

function metric(label,value,sub){return `<div class="card metric"><div class="label">${label}</div><div class="value mono">${value}</div><div class="sub">${sub}</div></div>`}
function ring(pct){
  const r=40,c=2*Math.PI*r,off=c-(Math.min(100,pct)/100)*c;
  return `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--soft2)" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${pct>=80?'var(--good)':'var(--accent)'}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="val">${pct}%</div></div>`;
}

function fieldsFor(track){
  return Object.entries(FIELDS).filter(([k])=>track==='all'||k.startsWith(track+'.'));
}
/* Search every occurrence of a partial word, regardless of its position.
   Arabic normalization removes harakat/tatweel and folds common letter variants. */
function libSearchNormalize(value){
 return String(value==null?'':value).toLowerCase().normalize('NFKC')
  .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
function libSearchText(i){
 return [i.ar,i.en,i.goal?.ar,i.goal?.en,
  FIELDOF(i.t,i.f),FIELDEN(i.t,i.f),
  TRACK(i.t)?.ar,TRACK(i.t)?.en,
  ...(Array.isArray(i.ph)?i.ph.flat():[]),
  ...(Array.isArray(i.tags)?i.tags:[])
 ].filter(x=>typeof x==='string').join(' ');
}
function libList(){
  const q=libSearchNormalize(libFilter.q);
  return LIB.filter(i=>{
    if(libFilter.track!=='all'&&i.t!==libFilter.track)return false;
    if(libFilter.field!=='all'&&i.t+'.'+i.f!==libFilter.field)return false;
    if(libFilter.age==='y'&&i.ages[1]>12)return false;
    if(libFilter.age==='m'&&i.ages[0]<13)return false;
    if(libFilter.only&&!isSel(i.id))return false;
    if(q&&!q.split(/\s+/).every(token=>libSearchNormalize(libSearchText(i)).includes(token)))return false;
    return true;
  });
}

/* User-created program tags are shared across the camp program library in this browser. */
function applyCustomLabels(){
 const data=S.customLabels||{};
 for(const [kind,dictionary] of [['tags',TAGNAMES],['needs',NEEDS]]){
  const saved=data[kind]||{};
  for(const [key,label] of Object.entries(saved)){
   if(!key.startsWith('user-'+kind+'-')||typeof label!=='string'||!label.trim())continue;
   dictionary[key]=[label,label];
  }
 }

    '<div class="actions" style="display:flex;gap:9px;justify-content:flex-end;margin-top:15px"><button data-act="close">'+T('إلغاء','Cancel')+'</button><button class="primary" data-act="savePrepRequirement">'+T('حفظ المتطلب','Save requirement')+'</button></div>');
  document.getElementById('prepNewName')?.focus();

function savePrepRequirement(){
  const name=(document.getElementById('prepNewName')?.value||'').trim().replace(/\s+/g,' ');
  if(name.length<2)return toast(T('أدخل اسم المتطلب (حرفان على الأقل).','Enter a requirement name of at least two characters.'));
  const manual=Array.isArray(S.prep.__manual)?S.prep.__manual:[];
  const existing=[...needsAgg().map(x=>NEEDS[x[0]]?.[0]||''),...manual.map(x=>x.name)];
  const norm=x=>String(x).normalize('NFKC').replace(/[\u064B-\u065F\u0640]/g,'').trim().toLowerCase();
  if(existing.some(x=>norm(x)===norm(name)))return toast(T('المتطلب مسجل بالفعل.','Requirement already exists.'));
  const id=newId('manual-prep-');
  S.prep.__manual=[...manual,{id,name}];S.prep[id]={owner:'',done:false};
  logIt('إضافة متطلب تشغيلي: '+name,'Added operational requirement: '+name);
  save();closeModal();render();toast(T('تمت إضافة المتطلب.','Requirement added.'));
}

function suggestions(){
  const out=[];
  if(valuesCount()<S.rules.valuesMin){
    LIB.filter(i=>i.t==='values'&&!isSel(i.id)).slice(0,2).forEach(i=>out.push({i,why:T('لترسيخ قيم في البناء','to anchor values')}));
  }
  TRACKS.forEach(t=>{ if(!trackCount(t.id)){const c=LIB.find(i=>i.t===t.id&&!isSel(i.id)); if(c)out.push({i:c,why:T('مسار فارغ من البناء','empty track')});} });
  if(unassigned()){const u=S.selected.find(x=>!x.day); if(u)out.push({i:ITEM(u.id),why:T('برنامج غير موزّع','unassigned program')});}
  return out.slice(0,4);
}

function stepPlan(){
  const rd=readiness(), f=fitStats(), na=needsAgg();
  const isFile=location.protocol==='file:';
  return `<div class="grid cols4 screenonly">
      ${metric(T('البرامج','Programs'),selCount(),T('في البناء','in the build'))}
      ${metric(T('الأساسية','Core'),coreCount(),T('برامج أساسية','core programs'))}
      ${metric(T('تغطية التحديات','Fit'),f.pct+'%',T(f.covered+' من '+f.total+' طلاب',f.covered+' of '+f.total+' students'))}
      ${metric(T('توثيق الخطة','Plan documentation'),rd.score+'%',T(rd.passed+' من '+rd.total+' فحص',rd.passed+' of '+rd.total+' checks'))}
    </div>
    <div class="printonly printcover">
      <div class="row" style="align-items:flex-start">
        <div>
          <div class="eyebrow">${T('أكاديمية النخبة · برنامج المعسكر','ELITE ACADEMY · CAMP PROGRAMME')}</div>
          <h1 style="margin-top:4px">${esc(L({ar:S.meta.campAr,en:S.meta.campEn}))}</h1>
          <p class="help">${esc(L({ar:S.meta.cityAr,en:S.meta.cityEn}))} · <span dir="ltr">${esc(S.meta.start)} — ${esc(S.meta.end)}</span> · ${S.meta.days.length} ${T('أيام','days')} · ${selCount()} ${T('برنامجًا','programs')}</p>
        </div>
        <div style="text-align:center"><b style="font-size:22px">${rd.score}%</b><div class="help">${T('توثيق الخطة','Plan documentation')}</div></div>
      </div>
    </div>
    <div class="row spacer noprint" style="gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div><h2 style="font-size:16px">${T('معاينة الجدول','Schedule preview')}</h2>
      <span class="help">${T('معاينة أولية لجدول يومي مبني على قالب ثابت؛ راجع أوقات الصلاة والجلسات والأنشطة قبل التنفيذ.','A preview based on a fixed template. Verify prayer times, sessions and activities before use.')}</span></div>
      <button class="primary" data-act="print">${T('طباعة','Print')}</button>
    </div>
    <div class="spacer schedule-print-pages">${programSection()}</div>

        ${na.length?`<div class="spacer">${na.map(([k,n])=>`<div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line)">
          <span style="font-size:12.5px">${esc(L({ar:NEEDS[k][0],en:NEEDS[k][1]}))}</span><b class="mono">${n}</b></div>`).join('')}</div>`:`<p class="help">${T('لا متطلبات.','None.')}</p>`}
        <p class="help" style="margin-top:10px">${T('تُستخرج المتطلبات من البرامج المختارة فقط، ويجب التأكد من توفرها قبل التنفيذ.','Requirements come from selected programs and must be verified before delivery.')}</p>

      <div class="card">
        <h2>${T('الاعتماد','Sign-off')}</h2>

          <div class="row" style="padding:6px 0"><span class="help">${T('التاريخ','Date')}</span><b dir="ltr">${new Date().toLocaleDateString('en-GB')}</b></div>

        </div>
      </div>
    </div>`;

/* ---------- رابط المشاركة ---------- */
function encodePlan(){
  const p={v:2,
    m:{campAr:S.meta.campAr,campEn:S.meta.campEn,cityAr:S.meta.cityAr,cityEn:S.meta.cityEn,
       start:S.meta.start,end:S.meta.end,ageMin:S.meta.ageMin,ageMax:S.meta.ageMax,students:S.meta.students,teams:S.meta.teams,days:S.meta.days},
    r:S.rules,
    s:S.selected.map(x=>({i:x.id,p:x.pri,d:x.day||0,w:x.why||'',a:x.approved?1:0})),
    customPrograms:S.customPrograms.filter(i=>S.selected.some(x=>x.id===i.id))
  };
  const bytes=new TextEncoder().encode(JSON.stringify(p));
  let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodePlan(str){
  const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function shareUrl(){
  return location.origin+location.pathname+'#plan='+encodePlan();
}
function mergeImportedCustomPrograms(items){
  if(!Array.isArray(items))return;
  if(!Array.isArray(S.customPrograms))S.customPrograms=[];
  const valid=items.filter(i=>i&&i.custom===true&&typeof i.id==='string'&&i.id.startsWith('CUSTOM-')&&TRACK(i.t)&&FIELDS[i.t+'.'+i.f]&&Array.isArray(i.ages)&&Array.isArray(i.tags)&&Array.isArray(i.need)&&Array.isArray(i.ph)&&i.goal&&typeof i.ar==='string');
  valid.forEach(i=>{if(!S.customPrograms.some(x=>x.id===i.id)){S.customPrograms.push(i);registerCustomPrograms([i])}});
}
function applyShared(p){
  if(!p||!Array.isArray(p.s))throw new Error('bad plan');
  mergeImportedCustomPrograms(p.customPrograms);
  const sel=p.s.filter(x=>ITEM(x.i)).map(x=>({id:x.i,pri:x.p==='core'?'core':'support',day:x.d||null,
    why:x.w||'',owner:'programs',approved:!!x.a,at:Date.now()}));
  if(!sel.length)throw new Error('empty plan');
  const camp=makeCamp({id:newId('camp-'),status:'draft',step:5,selected:sel,shared:true,
    meta:p.m||{},rules:p.r||{},
    log:[{id:Date.now(),at:Date.now(),ar:'وصلت خطة مشتركة',en:'Shared plan received',role:S.role}]});
  if(p.m){camp.meta=Object.assign(baseMeta(),p.m)}
  S.camps.unshift(camp);
  S.activeId=camp.id;
  S.step=5;
  save();
}
function copyLink(){
  const url=shareUrl();
  if(location.protocol==='file:'){toast(T('روابط المشاركة تعمل من النسخة المنشورة على الإنترنت.','Share links work from the published online version.'));return}
  const done=()=>{toast(T('نُسخ رابط الخطة — أرسله لمن تريد.','Plan link copied — send it anywhere.'));openModal(`<h2>${T('رابط مشاركة نسخة الخطة','Shareable plan-copy link')}</h2>
    <p class="help">${T('يفتح نفس البناء عند أي شخص، ويستطيع تعديل نسخته.','Opens the same build for anyone, and they can edit their copy.')}</p>
    <div class="sharebox"><input readonly value="${esc(url)}" dir="ltr"><button class="small" data-act="close">${T('تم','Done')}</button></div>`);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  else fallbackCopy(url,done);
}

function ocAnalyze(){
 const start=ocInputs.start,duration=Number(ocInputs.duration);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!Number.isInteger(duration)||duration<1||duration>31){ocAnalysis=null;return;}
 const end=ocAddDays(start,duration-1),segments=[];
 for(let i=0;i<duration;i++){
  const date=ocAddDays(start,i),event=ocEvent(date)||null;
  const previous=segments[segments.length-1];
  if(previous&&previous.id===(event?event.id:null)){previous.end=date;previous.days++;}
  else segments.push({id:event?event.id:null,start:date,end:date,days:1,event});
 }
 const covered=segments.filter(g=>g.event).reduce((sum,g)=>sum+g.days,0),outside=duration-covered;
 const matches=segments.filter(g=>g.event),full=outside===0&&matches.length===1;
 const event=full?matches[0].event:null;
 ocAnalysis={start,end,duration,covered,outside,segments,full,event};
 ocAnalysisCollapsed=false;
}

function ocHandleClick(el){
 const kind=el.dataset.oc;
 if(kind==='prev')return ocMonthsShift(-1);
 if(kind==='next')return ocMonthsShift(1);
 if(kind==='filter'){ocFilter=el.dataset.filter;return render();}
 if(kind==='event')return ocOpenEvent(el.dataset.id);
 if(kind==='createEvent'){const ev=OC_EVENTS.find(x=>x.id===el.dataset.id);if(!ev)return;ocSelected=ev.id;ocSetHolidayRange(ev);ocCreateDuringHoliday();return;}
 if(kind==='day'){ocDate=el.dataset.date;const ev=ocEvent(ocDate);if(ev){if(ocSelected!==ev.id)ocSelected=ev.id;ocSetHolidayRange(ev,ocDate);}return render();}
 if(kind==='compare'){ocComparison=!ocComparison;return render();}
 if(kind==='toggleAnalysis'){const top=window.scrollY;ocAnalysisCollapsed=!ocAnalysisCollapsed;render();window.scrollTo(0,top);return;}
 if(kind==='use'){const e=OC_EVENTS.find(x=>x.id===ocSelected);ocInputs.start=e.start;ocInputs.duration=String(Math.min(7,Math.max(3,ocDayCount(e.start,e.end))));ocAnalyze();render();return;}
 if(kind==='analyze'){ocAnalyze();render();return;}
 if(kind==='create'){ocNewCamp();return;}
 if(kind==='createHoliday'){ocCreateDuringHoliday();return;}
 if(kind==='focus'){document.getElementById('oc-simulator')?.scrollIntoView({behavior:'smooth',block:'center'});}
}

function finState(){
 const c=activeCamp();if(!c.finance||typeof c.finance!=='object')c.finance={rows:[],reservePct:10,expectedStudents:0,fee:0,actualTuitionReceived:0};
 const d=c.finance;if(!Array.isArray(d.rows))d.rows=[];
 if(!Number.isFinite(+d.reservePct))d.reservePct=10;
 if(!Number.isFinite(+d.expectedStudents))d.expectedStudents=0;
 if(!Number.isFinite(+d.fee))d.fee=0;
 if(!Number.isFinite(+d.actualTuitionReceived))d.actualTuitionReceived=0;
 return d;
}
const finNumber=(v)=>{const n=Number(v);return Number.isFinite(n)&&n>=0?n:0};
const finMoney=n=>new Intl.NumberFormat(lang==='ar'?'ar-SA':'en-US',{maximumFractionDigits:2,minimumFractionDigits:0}).format(n)+' '+T('ر.س','SAR');
const finCategory=id=>{const x=FIN_CATEGORIES.find(y=>y[0]===id);return x?T(x[1],x[2]):id||T('أخرى','Other')};
const finTotal=(r,p)=>finNumber(r[p+'Qty'])*finNumber(r[p+'Unit']);
function finCalc(d){
 const costs=d.rows.filter(x=>x.kind==='cost'),revenues=d.rows.filter(x=>x.kind==='revenue');
 const plannedCosts=costs.reduce((a,x)=>a+finTotal(x,'plan'),0);
 const actualCosts=costs.reduce((a,x)=>a+finTotal(x,'actual'),0);
 const reserve=plannedCosts*finNumber(d.reservePct)/100;
 const forecastTuition=finNumber(d.expectedStudents)*finNumber(d.fee);
 const forecastOther=revenues.reduce((a,x)=>a+finTotal(x,'plan'),0);
 const actualRevenue=revenues.reduce((a,x)=>a+finTotal(x,'actual'),0)+finNumber(d.actualTuitionReceived);
 return {costs,revenues,plannedCosts,actualCosts,reserve,budget:plannedCosts+reserve,
  forecastTuition,forecastOther,forecastRevenue:forecastTuition+forecastOther,
  actualRevenue,forecastBalance:forecastTuition+forecastOther-plannedCosts-reserve,
  actualBalance:actualRevenue-actualCosts};
}

 const d=finState();const row={id:id||newId('fin-'),kind:get('fin-kind')==='revenue'?'revenue':'cost',category:get('fin-customCategory').trim().slice(0,60)||get('fin-category'),
  name:name.slice(0,100),unit:unit.slice(0,40),note:get('fin-note').slice(0,400)};
 keys.forEach(k=>row[k]=finNumber(get('fin-'+k)));
 const index=d.rows.findIndex(x=>x.id===id);if(index>=0)d.rows[index]=row;else d.rows.push(row);

function finRemove(id){

function finSetting(key,value){

 if(!['expectedStudents','fee','reservePct','actualTuitionReceived'].includes(key))return;

 finState()[key]=finNumber(value);save();render();
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-fin]');if(!b)return;
 e.preventDefault();const action=b.dataset.fin;
 if(action==='export')return finExport();
 if(action==='newcost')return finEdit();
 if(action==='newrevenue'){finEdit();const type=document.getElementById('fin-kind');if(type)type.value='revenue';return}
 if(action==='categoryadd'){finEdit();const category=document.getElementById('fin-category');if(category)category.value=b.dataset.cat;return;}
 if(action==='template')return finEdit(null,b.dataset.template);
 if(action==='edit')return finEdit(b.dataset.id);
 if(action==='save')return finSave(b.dataset.id);
 if(action==='delete')return finRemove(b.dataset.id);
});
document.addEventListener('change',e=>{
 const b=e.target.closest('[data-fin-setting]');if(b)finSetting(b.dataset.finSetting,b.value);
});

let lastRenderedPage=null;
function render({preserveScroll}={}){
  if(!PAGES[page]) page='camps';
  // Same-page saves, edits, assignments and filters keep the user's position.
  // Actual navigation to a different section continues to start at the top.
  const keepPosition=preserveScroll===undefined?(lastRenderedPage===page):preserveScroll;
  const previousScrollY=keepPosition?window.scrollY:0;
  document.body.classList.toggle('finance-exact-mode',page==='finance');
  header();
  const container=$('#app');
  container.innerHTML=(page==='finance'?'':`<div class="demo noprint"><span>◈ ${T('نموذج تخطيط تجريبي · بيانات الطلاب افتراضية · الحفظ على هذا المتصفح فقط','Planning prototype · sample student data · saved in this browser only')}</span><span>${T('مواءمة تخطيطية وليست تقييمًا للطالب','Planning alignment, not student assessment')}</span></div>`)+PAGES[page]();
  if(page==='finance'){
    const financeFrame=document.getElementById('financeExactFrame');
    financeFrame?.addEventListener('load',()=>{
      try{
        const doc=financeFrame.contentDocument;
        if(!doc)return;
        // Use the actual finance main content, never iframe viewport/document
        // scrollHeight, which can create a feedback loop and endless blank space.
        const content=doc.querySelector('main');
        if(!content)return;
        const css=doc.createElement('style');
        css.textContent='html,body{margin:0!important;min-height:0!important;overflow-x:hidden!important;overflow-y:hidden!important}main{height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}';
        doc.head.appendChild(css);
        let raf=0,lastHeight=0;
        const measure=()=>{
          raf=0;
          if(!financeFrame.isConnected||!content.isConnected)return;
          const style=financeFrame.contentWindow.getComputedStyle(content);
          const bounds=content.getBoundingClientRect();
          const height=Math.max(200,Math.ceil(bounds.height+parseFloat(style.marginTop||0)+parseFloat(style.marginBottom||0))+2);
          if(Math.abs(height-lastHeight)>3){
            lastHeight=height;
            financeFrame.style.height=height+'px';
          }
        };
        const schedule=()=>{
          if(!raf)raf=requestAnimationFrame(measure);
        };
        schedule();
        if(typeof ResizeObserver!=='undefined'){
          const observer=new ResizeObserver(schedule);
          observer.observe(content);
          financeFrame.addEventListener('load',()=>{observer.disconnect();cancelAnimationFrame(raf)},{once:true});
        }
        doc.fonts?.ready.then(schedule);
        financeFrame.contentWindow?.addEventListener('resize',schedule,{passive:true});
      }catch(err){console.warn('Finance embed sizing unavailable',err)}
    },{once:true});
  }
  if(page==='library'){renderLib();}
  S.page=page;S.lang=lang;save();
  try{history.replaceState(null,'','#'+page)}catch(e){}
  lastRenderedPage=page;
  // Restore after replacing the view; never jump to the top for same-page actions.
  window.scrollTo({top:keepPosition?previousScrollY:0,left:0,behavior:'instant'});
}

let pendingProgramChoice=null;
function beginProgramChoice(id,options={}){
  if(!can('select'))return toast(T('هذا الإجراء غير متاح لدورك.','Not available for your role.'));
  if(isSel(id))return toast(T('البرنامج موجود في الخطة.','Program is already selected.'));
  if(!ITEM(id))return;
  pendingProgramChoice={id,pri:'support',day:options.day||null,slot:options.slot||null,
    why:'',owner:S.role,approved:false,at:Date.now()};
  editModal(id);
}
function pick(id,silent){beginProgramChoice(id)}

function unpick(id){
  if(!can('select')){toast(T('هذا الإجراء غير متاح لدورك.','This action is not available for your role.'));return}
  const it=ITEM(id);const was=S.selected.find(x=>x.id===id);
  S.selected=S.selected.filter(x=>x.id!==id);S.draft=false;
  if(was&&was.approved)logIt(`سُحب من الخطة: ${it.ar}`,`Removed from plan: ${it.en}`);
  else logIt(`أُزيل من الخطة: ${it.ar}`,`Removed from plan: ${it.en}`);
  save();render();
}
function confirmTrayRemove(id){
  if(!can('select'))return;
  const x=S.selected.find(p=>p.id===id);
  if(!x||x.day)return closeModal();
  const item=ITEM(id);if(!item)return closeModal();
  S.selected=S.selected.filter(p=>p.id!==id);
  S.draft=false;
  logIt('إزالة برنامج غير موزع: '+item.ar,'Removed unassigned program: '+item.en);
  closeModal();
  save();render({preserveScroll:true});
  toast(T('أُزيل البرنامج من الخطة، وهو متاح للإضافة مجددًا.','Program removed from plan and available to add again.'));
}
function patch(id,k,v){
  const x=S.selected.find(s=>s.id===id);if(!x)return;
  x[k]=k==='day'?(v?+v:null):v;S.draft=false;
  const it=ITEM(id);
  logIt(`تعديل «${it.ar}»: ${k==='day'?'اليوم '+v:k==='pri'?(v==='core'?'أساسي':'مساند'):'تحديث المبرر'}`,`Updated “${it.en}”: ${k}`);
  save();
}
function autoPlan(){
  if(!can('select'))return;
  const order=[...S.selected].sort((a,b)=>{
    const A=ITEM(a.id),B=ITEM(b.id);
    if(a.pri!==b.pri)return a.pri==='core'?-1:1;
    return (B.load||0)-(A.load||0);
  });
  const loads=S.meta.days.map(()=>0);
  order.forEach(x=>{
    let best=0;
    for(let i=0;i<loads.length;i++){if(loads[i]<loads[best])best=i}
    x.day=best+1;loads[best]++;
  });
  logIt(T('توزيع تلقائي متوازن على أيام المعسكر','Auto-distributed across camp days').ar||'توزيع تلقائي متوازن على أيام المعسكر','Auto-distributed across camp days');
  save();render();toast(T('وُزّعت البرامج على الأيام بأقل حمل.','Programs distributed with the lowest daily load.'));
}

function customProgramFields(track){

function customBreakdownSource(track,field){
 const same=LIB.filter(i=>!i.custom&&i.t===track&&i.f===field);
 const others=LIB.filter(i=>!i.custom&&i.t===track&&i.f!==field);
 const programs=[...same,...others];
 const seen=new Set(),options=[];
 for(const program of programs){
  for(const [n,phase] of (program.ph||[]).entries()){
   const value=String(L({ar:phase[0],en:phase[1]})||'').trim();
   if(value.length<3||seen.has(value))continue;
   seen.add(value);
   options.push({value,program:L({ar:program.ar,en:program.en}),phase:n+1,match:program.f===field});
  }
 }
 if(track==='sport'){
  for(const program of programs){
   for(const value of ELITE_SPORT_SUBACTIVITIES[program.id]||[]){
    if(seen.has(value))continue;seen.add(value);options.push({value,program:L({ar:program.ar,en:program.en}),phase:0,match:program.f===field});
   }
  }
 }
 return options.sort((a,b)=>Number(b.match)-Number(a.match));
}

function addCustomLabel(kind){
 if(!can('catalog'))return;
 const isTag=kind==='tags',isNeed=kind==='needs';
 if(!isTag&&!isNeed)return;
 const input=$(isTag?'#cpNewTag':'#cpNewNeed');
 const group=input?.previousElementSibling;
 const dict=isTag?TAGNAMES:NEEDS;
 const value=input?.value.trim().replace(/\s+/g,' ');
 if(!input||!group||!value)return toast(T('أدخل اسم الوسم أولاً.','Enter a tag name first.'));
 if(value.length<2||value.length>48)return toast(T('اسم الوسم يجب أن يتراوح بين حرفين و48 حرفاً.','Tag must be 2–48 characters.'));
 const norm=x=>String(x).normalize('NFKC').replace(/[\u064B-\u065F\u0640]/g,'').trim().toLocaleLowerCase();
 const found=Object.keys(dict).find(k=>norm(dict[k][0])===norm(value)||norm(dict[k][1])===norm(value));
 if(found){
  const existing=Array.from(group.querySelectorAll('input[type="checkbox"]')).find(el=>(isTag?el.dataset.customTag:el.dataset.customNeed)===found);
  if(existing){existing.checked=true;existing.closest('label')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
  input.value='';
  return toast(T('الوسم موجود مسبقاً وتم تحديده.','Existing tag selected.'));
 }
 const key='user-'+kind+'-'+newId('');
 if(!S.customLabels)S.customLabels={tags:{},needs:{}};
 if(!S.customLabels[kind])S.customLabels[kind]={};
 S.customLabels[kind][key]=value;
 dict[key]=[value,value];
 const label=document.createElement('label'),checkbox=document.createElement('input'),textNode=document.createElement('span');
 checkbox.type='checkbox';checkbox.checked=true;checkbox.dataset[isTag?'customTag':'customNeed']=key;
 textNode.className='option-text';textNode.textContent=value;
 label.append(checkbox,textNode);group.append(label);
 input.value='';save();
 toast(T('أُضيف الوسم واختير للبرنامج الحالي.','Tag added and selected for this program.'));
}

function saveCustomProgram(id){
  if(!can('catalog'))return;
  const v=n=>($('#'+n)?.value||'').trim();
  const ar=v('cpAr'),en=v('cpEn')||ar,goal=v('cpGoal'),t=v('cpTrack'),f=v('cpField');
  const min=Number(v('cpAgeMin')),max=Number(v('cpAgeMax')),load=Number(v('cpLoad'));
  if(ar.length<3||goal.length<10)return toast(T('أدخل اسم برنامج من 3 أحرف على الأقل وهدفًا واضحًا من 10 أحرف على الأقل.','Enter a program name of at least 3 characters and a goal of at least 10.'));
  if(!TRACK(t)||!FIELDS[t+'.'+f])return toast(T('اختر مسارًا ومجالًا صحيحين.','Select a valid track and field.'));
  if(!Number.isInteger(min)||!Number.isInteger(max)||min<6||max>18||min>max)return toast(T('تأكد من أن الأعمار بين 6 و18 وأن الحد الأدنى لا يتجاوز الأعلى.','Ages must be between 6 and 18, with minimum not greater than maximum.'));
  if(![1,2,3].includes(load))return toast(T('اختر مستوى تجهيز صحيحًا.','Choose a valid preparation level.'));
  if(LIB.some(x=>x.id!==id&&x.ar.trim().toLowerCase()===ar.toLowerCase()))return toast(T('يوجد برنامج بهذا الاسم في المكتبة.','A program with this name already exists.'));
  const original=id?ITEM(id):null;
  if(id&&(!original||!original.custom))return;
  const sportChoice=t==='sport'?$('[name="customSport"]:checked')?.value||'':'';
  if(t==='sport'&&!sportChoice)return toast(T('اختر رياضة واحدة.','Select one sport.'));
  const item={id:id||newId('CUSTOM-'),custom:true,t,f,ar,en,ages:[min,max],load,activityType:v('cpActivityType'),sportChoice,activityBreakdown:[...new Set([...$('[data-cp-breakdown]:checked').map(el=>el.value.trim()),...$('[data-sport-detail]:checked').map(el=>el.value.trim()),...v('cpActivityBreakdown').split(/\r?\n/).map(v=>v.trim()).filter(Boolean)])].join('\n'),
    goal:{ar:goal,en:goal},
    need:$$('[data-custom-need]:checked').map(x=>x.dataset.customNeed),
    tags:$$('[data-custom-tag]:checked').map(x=>x.dataset.customTag),
    ph:[1,2,3].map(n=>{const x=v('cpPh'+n);return [x,x]})};
  if(!Array.isArray(S.customPrograms))S.customPrograms=[];
  const pos=S.customPrograms.findIndex(x=>x.id===item.id);
  if(pos>=0)S.customPrograms[pos]=item;else S.customPrograms.push(item);
  registerCustomPrograms([item]);
  logIt(id?`تحديث البرنامج المضاف: ${ar}`:`إضافة برنامج للمكتبة: ${ar}`,id?`Updated custom program: ${en}`:`Created library program: ${en}`);
  save();closeModal();libFilter.q='';libFilter.only=false;libFilter.track=t;libFilter.field='all';
  if(!id&&customProgramReturnPage==='builder'){
    S.binTrack=t;binSearchQuery='';
    page='builder';
  }else{
    page='library';
  }
  render();
  toast(id?T('حُفظت التعديلات.','Program updated.'):T('حُفظ البرنامج في المكتبة. يمكنك إضافته الآن إلى خطة المعسكر.','Program saved to the library. You can now add it to this camp.'));
}

  const used=S.camps.filter(c=>c.selected.some(x=>x.id===id));

    <p class="help" style="margin:8px 0">${esc(i.ar)} — ${T('سيُحذف تعريف هذا البرنامج من مكتبة المتصفح. هذا الإجراء لا يمكن التراجع عنه.','Its definition will be removed from this browser library. This cannot be undone.')}</p>

function confirmDeleteProgram(id){

function saveEdit(id){
  const existing=S.selected.find(s=>s.id===id);
  if(!(can('select')||(can('scheduleEdit')&&existing)))return toast(T('التعديل غير متاح لهذا الدور.','Editing is not permitted for this role.'));

  const isNew=!existing&&pendingProgramChoice?.id===id;
  const x=existing||(isNew?pendingProgramChoice:null);
  if(!x)return;
  const item=ITEM(id);
  const sport=item?.t==='sport'?$('[name="selectedSport"]:checked')?.value||'':'';
  if(item?.t==='sport'&&!sport)return toast(T('اختر رياضة واحدة أولًا.','Select one sport first.'));
  const choices=[...new Set([
    ...$$('[data-approved-phase]:checked').map(el=>el.value.trim()),
    ...$$('[data-sport-detail]:checked').map(el=>el.value.trim()),
    ...($('#eBreakdown')?.value||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean)
  ])];
  if(!choices.length)return toast(T('اختر تفريعة واحدة على الأقل قبل الحفظ.','Select at least one subactivity before saving.'));
  // Apply changes only after every validation succeeds.
  x.pri=$('#ePri').value;
  x.day=$('#eDay').value?+$('#eDay').value:null;
  x.why=$('#eWhy').value.trim();
  x.activityType=$('#eActivityType').value;
  if(item?.t==='sport')x.sportChoice=sport;
  x.activityBreakdown=choices.join('\n');
  if(isNew){
    if(isSel(id))return toast(T('البرنامج موجود في الخطة.','Program already selected.'));
    S.selected.push(x);
    S.draft=false;
    logIt(`أُضيف إلى الخطة بعد اختيار التفريعات: ${item.ar}`,`Added to plan after choosing subactivities: ${item.en}`);
    pendingProgramChoice=null;
  }else{
    logIt(`حُدّث قرار «${item.ar}»`,`Decision updated: ${item.en}`);
  }
  save();closeModal();render({preserveScroll:true});
  toast(isNew?T('أُضيف البرنامج إلى الخطة بعد حفظ التفريعات.','Program added after saving subactivities.'):T('حُفظ قرار الاختيار.','Selection decision saved.'));
}

function download(name,content,type){
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:type||'text/plain;charset=utf-8'}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function packData(){
  return {
    camp:{ar:S.meta.campAr,en:S.meta.campEn,city:S.meta.cityAr,start:S.meta.start,end:S.meta.end,ageMin:S.meta.ageMin,ageMax:S.meta.ageMax,students:S.meta.students,days:S.meta.days},
    rules:S.rules,readiness:readiness().score,customPrograms:S.customPrograms.filter(i=>S.selected.some(x=>x.id===i.id)),
    selection:[...S.selected].sort((a,b)=>(a.day||9)-(b.day||9)).map(x=>{const i=ITEM(x.id);return {
      day:x.day,programAr:i.ar,programEn:i.en,track:L(TRACK(i.t)),field:L({ar:FIELDOF(i.t,i.f),en:FIELDEN(i.t,i.f)}),
      priority:x.pri,rationale:x.why||'',approved:!!x.approved,
      phases:i.ph.map(p=>({ar:p[0],en:p[1]})),needs:i.need.map(n=>L({ar:NEEDS[n][0],en:NEEDS[n][1]}))
    }}),
    requirements:needsAgg().map(([k,n])=>({need:L({ar:NEEDS[k][0],en:NEEDS[k][1]}),programs:n,owner:(S.prep[k]||{}).owner||'',done:!!(S.prep[k]||{}).done})),
    coverage:fitStats().pct,
    generated:new Date().toISOString()
  };
}
function parsePlan(obj){
  mergeImportedCustomPrograms(obj&&obj.customPrograms);
  const mapAr=new Map(LIB.map(i=>[i.ar,i.id]));
  const mapEn=new Map(LIB.map(i=>[i.en,i.id]));
  if(!obj||!Array.isArray(obj.selection))throw new Error('no selection');
  const picked=[];
  obj.selection.forEach(r=>{
    const id=mapAr.get(r.programAr)||mapEn.get(r.programEn)||(ITEM(r.id)?r.id:null);
    if(!id)return;
    picked.push({id,pri:r.priority==='core'?'core':'support',day:r.day?+r.day:null,
      why:r.rationale||'',owner:'programs',approved:!!r.approved,at:Date.now()});
  });
  if(!picked.length)throw new Error('nothing matched');
  return {picked,camp:obj.camp||null,rules:obj.rules||null};
}
function importClick(){ $('#importFile') && $('#importFile').click(); }
function readImport(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      pendingImport=parsePlan(JSON.parse(fr.result));
      importPreview();
    }catch(e){toast(T('ملف غير صالح. تأكد أنه مُصدَّر من هذه الأداة.','Invalid file. Make sure it was exported from this tool.'))}
  };
  fr.readAsText(file);
}

function summaryText(){
  const lines=[];
  lines.push(T('خطة اختيار المهارات والقيم — ','Skills & values selection — ')+L({ar:S.meta.campAr,en:S.meta.campEn}));
  lines.push(`${L({ar:S.meta.cityAr,en:S.meta.cityEn})} · ${S.meta.start} — ${S.meta.end} · ${S.meta.students} ${T('طالبًا','students')}`);
  lines.push('');
  S.meta.days.forEach((d,i)=>{
    const items=S.selected.filter(x=>x.day===i+1);
    if(!items.length)return;
    lines.push(`${T('اليوم','Day')} ${i+1} · ${L(d)}`);
    items.forEach(x=>{const it=ITEM(x.id);lines.push(`  • ${L({ar:it.ar,en:it.en})}${x.pri==='core'?T(' (أساسي)',' (core)'):''}`)});
  });
  const un=S.selected.filter(x=>!x.day);
  if(un.length){lines.push('');lines.push(T('غير موزّع:','Unassigned:')+' '+un.map(x=>L({ar:ITEM(x.id).ar,en:ITEM(x.id).en})).join('، '));}
  lines.push('');
  lines.push(T('اكتمال شروط الخطة: ','Planning checks: ')+readiness().score+'% · '+T('المعتمد: ','Approved: ')+S.selected.filter(x=>x.approved).length+'/'+selCount());
  return lines.join('\n');
}
function copySummary(){
  const text=summaryText();
  const done=()=>toast(T('نُسخ الملخص — الصقه في واتساب أو بريد الفريق.','Summary copied — paste it into WhatsApp or email.'));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done))}
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){openModal(`<h2>${T('انسخ الملخص','Copy the summary')}</h2><textarea style="width:100%;min-height:260px">${esc(text)}</textarea>`)}
  ta.remove();
}

function exportCsv(){
  const rows=[['day','program_ar','program_en','track','field','priority','rationale','needs','approved']];
  [...S.selected].sort((a,b)=>(a.day||9)-(b.day||9)).forEach(x=>{const i=ITEM(x.id);
    rows.push([x.day||'',i.ar,i.en,L(TRACK(i.t)),L({ar:FIELDOF(i.t,i.f),en:FIELDEN(i.t,i.f)}),x.pri,(x.why||'').replace(/"/g,'""'),i.need.map(n=>L({ar:NEEDS[n][0],en:NEEDS[n][1]})).join(' | '),x.approved?1:0])});
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('elite-camp-selection.csv',csv,'text/csv;charset=utf-8');toast(T('صُدّر ملف CSV.','CSV exported.'));
}

      save();closeModal();render();},

    delDay:()=>{const n=+arg;if(S.meta.days.length<=3)return;S.meta.days.splice(n-1,1);
      S.selected.forEach(x=>{if(x.day===n)x.day=null;else if(x.day>n)x.day=x.day-1});

      if(!can('reset'))return;

document.addEventListener('change',e=>{const t=e.target;if(page==='opportunities'&&t.dataset.ocInput){ocInputs[t.dataset.ocInput]=t.value;ocAnalysis=null;}if(page==='opportunities'&&t.dataset.ocHoliday){if(t.dataset.ocHoliday==='start')ocHolidayStart=t.value;else ocHolidayEnd=t.value;}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){libFilter.q=t.value;renderLib()}
  if(t.matches('[data-branch-search]')){
    const root=t.closest('[data-branch-organizer]'),q=libSearchNormalize(t.value);
    let shown=0;
    root?.querySelectorAll('[data-branch-group]').forEach(group=>{
      const title=libSearchNormalize(group.querySelector('summary strong')?.textContent||'');
      let matches=0;
      group.querySelectorAll('[data-branch-item]').forEach(item=>{
        const yes=!q||title.includes(q)||libSearchNormalize(item.textContent).includes(q);
        item.hidden=!yes;if(yes)matches++;
      });
      group.hidden=!matches;if(matches){shown++;if(q)group.open=true;}
    });
    const empty=root?.querySelector('[data-branch-empty]');if(empty)empty.hidden=shown>0;
    return;
  }
  if(t.id==='binSearch'){
    binSearchQuery=t.value;
    const terms=libSearchNormalize(binSearchQuery).split(/\s+/).filter(Boolean);
    const cards=$$('#binSearchResults .bin[data-bin-search]');
    let visible=0;
    cards.forEach(card=>{
      const act=card.querySelector('[data-act^="add:"]')?.dataset.act||'';
      const i=ITEM(act.slice(4));
      const matches=!!i&&terms.every(term=>binSearchText(i,binSearchQuery).includes(term));
      card.hidden=!matches;if(matches)visible++;
    });
    const empty=$('#binSearchEmpty');if(empty)empty.hidden=visible>0;
    return;
  }
  if(t.id==='campQ'){campFilter.q=t.value;render();const el=$('#campQ');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
  if(t.id==='wDays'){wizCollect();wiz.d.dayCount=+t.value;renderWiz();return}
  if(t.id==='pkQ'){const q=t.value.toLowerCase();$$('#pkList [data-pk]').forEach(r=>{const i=ITEM(r.dataset.pk);r.style.display=(L({ar:i.ar,en:i.en})+' '+L(i.goal)).toLowerCase().includes(q)?'':'none'})}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-cp-breakdown]')){
    const root=t.closest('[data-branch-organizer]');
    if(root){
      const count=root.querySelectorAll('[data-cp-breakdown]:checked').length;
      const badge=root.querySelector('[data-branch-count]');if(badge)badge.textContent=count+' '+T('محددة','selected');
      root.querySelectorAll('[data-branch-group]').forEach(group=>{
        const n=group.querySelectorAll('[data-cp-breakdown]:checked').length;
        const label=group.querySelector('[data-group-count]');if(label)label.textContent=n?n+' '+T('مختارة','chosen'):'';
      });
    }
    return;
  }
  if(t.id==='cpTrack'){refreshCustomFields();return}
  if(t.id==='cpField'){refreshCustomBreakdowns();return}
  if(t.matches('[data-one-sport]')){const p=t.closest('.elite-sport-pickbox')?.querySelector('[data-sport-details]');if(p)p.innerHTML=sportSkillOptions(t.value);return}
  if(t.id==='fTrack'){libFilter.track=t.value;libFilter.field='all';render();return}
  if(t.id==='fField'){libFilter.field=t.value;render();return}
  if(t.id==='fAge'){libFilter.age=t.value;render();return}
  if(t.id==='fOnly'){libFilter.only=t.checked;render();return}
  if(t.id==='importFile'){readImport(t.files&&t.files[0]);t.value='';return}
  if(t.id==='roleSel'){S.role=t.value;logIt(`تبديل الدور إلى ${ROLE(t.value).ar}`,`Role switched to ${ROLE(t.value).en}`);save();render();return}
  const dm=t.closest('[data-meta]');
  if(dm){S.meta[dm.dataset.meta]=(t.type==='number')?+t.value:t.value;save();return}
  const dt=t.closest('[data-daytheme]');
  if(dt){const i=+dt.dataset.daytheme;if(S.meta.days[i]){S.meta.days[i][lang]=t.value;save();render()}return}
  const ed=t.closest('[data-edit]');
  if(ed){const [k,id]=ed.dataset.edit.split(':');patch(id,k,t.value);if(k!=='why')render();return}
  const ru=t.closest('[data-rule]');
  if(ru){S.rules[ru.dataset.rule]=+t.value;logIt('تحديث قواعد الاختيار','Selection rules updated');save();render();return}
  const pr=t.closest('[data-prep]');
  if(pr){const [k,key]=pr.dataset.prep.split(':');S.prep[key]=S.prep[key]||{};
    S.prep[key][k]=k==='done'?t.checked:t.value;save();if(k==='done')render();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.key==='/'||e.key==='k')&&page==='library'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q')&&$('#q').focus()}
});

(function boot(){
  const raw=location.hash||'';
  if(raw.indexOf('#plan=')===0){
    try{applyShared(decodePlan(raw.slice(6)));page='builder';S.step=5;S.shared=true;}
    catch(e){toast(T('رابط الخطة غير صالح أو ناقص.','The plan link is invalid or incomplete.'))}
  }
  const h=(location.hash||'').replace(/^#/,'').replace(/\.+$/,'');
  if(raw.indexOf('#plan=')!==0&&h&&PAGES[h])page=h;
  if(!S.step)S.step=1;
  if(!S.log.length){logIt('أُنشئت مسودة الاختيار','Example draft created');save()}
  if(!S.seenGuide&&!location.hash){S.seenGuide=true;setTimeout(()=>{if(!$('#modal').open)guideModal()},400)}
  render();
})();

 return '<article class="guided-item" data-pk="'+escP(i.id)+'" data-track="'+escP(i.t)+'" data-keywords="'+escP([name,goal,track,...subs].join(' ').toLowerCase())+'"><div class="guided-row"><div class="guided-info"><b>'+escP(name)+'</b><div class="help">'+escP(track)+' · '+escP(L({ar:FIELDOF(i.t,i.f),en:FIELDEN(i.t,i.f)}))+'</div><p>'+escP(goal)+'</p><span class="pill line">'+subs.length+' تفريعات</span> <span class="pill line">'+needs.length+' متطلبات</span></div><div class="guided-actions"><button class="small" data-guided-details aria-expanded="false">عرض التفريعات</button><button class="small primary" data-pickhere="'+escP(i.id)+'">تخصيص وإضافة</button></div></div><div class="guided-details" hidden><b>التفريعات المتاحة</b>'+(subs.length?'<ul>'+subs.map(v=>'<li>'+escP(v)+'</li>').join('')+'</ul>':'<p>يمكن إضافة تفريعات يدوية.</p>')+'<b>متطلبات التنفيذ</b><p>'+escP(needs.join('، ')||'لا يوجد متطلب محدد')+'</p></div></article>';
}).join('')+'</div><div id="guidedEmpty" class="empty" hidden>لا توجد نتائج مطابقة</div><div class="guided-footer"><span id="guidedCount">'+pool.length+' برنامج متاح</span><button data-act="close">إغلاق</button></div></div>');
